<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stopframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='1' y='1' width='24' height='24' rx='6' fill='%23FFD84D'/%3E%3Cpath d='M8 7v12M13 10v9M18 13v6' stroke='%230E1013' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/matches" aria-label="Stopframe home">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="6" fill="#FFD84D"></rect><path d="M8 7v12M13 10v9M18 13v6" stroke="#0E1013" stroke-width="2.6" stroke-linecap="round"></path></svg>
    <span class="brand-name">Stopframe</span>
  </a>
  <span class="crumb" id="crumb"></span>
  <nav aria-label="Workspace" class="tabs" id="tabs"></nav>
  <div class="spacer"></div>
  <a class="activity" id="activity" href="#/jobs"></a>
  <span class="disk" id="disk"></span>
</header>
<main id="view" class="view" tabindex="-1"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
